<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出勤一打</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="actions">
    <button id="runNowBtn" class="btn btn-primary">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
      <span>手動で出勤</span>
    </button>
    <button id="punchOutBtn" class="btn btn-punchout">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      <span>退勤を記録</span>
    </button>
  </div>

  <div class="container">
    <section class="card">
      <div class="row">
        <label for="enabledToggle" class="label">自動打刻を有効にする</label>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="card ip-card">
      <div class="row">
        <label for="ipFilterToggle" class="label">指定IPのみで自動打刻（任意）</label>
        <label class="switch">
          <input type="checkbox" id="ipFilterToggle" />
          <span class="slider"></span>
        </label>
      </div>
      <div id="ipConfigArea" class="ip-config">
        <label for="allowedIpInput" class="sub-label">学校のグローバルIP</label>
        <input
          type="text"
          id="allowedIpInput"
          class="text-input"
          placeholder="例: 203.0.113.10"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="ip-actions">
          <button type="button" id="fetchIpBtn" class="btn btn-small btn-outline">現在のIPを取得</button>
          <button type="button" id="saveIpBtn" class="btn btn-small btn-secondary">保存</button>
        </div>
        <div id="ipHintText" class="meta-text">カンマ区切りで複数IPも指定できます</div>
      </div>
    </section>

    <section class="card status-card">
      <div class="status-title">ステータス</div>
      <div id="statusText" class="status-text">読み込み中...</div>
      <div id="lastPunchText" class="meta-text"></div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出勤一打</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>出勤一打</h1>
      <span id="todayBadge" class="badge badge-pending">未打刻</span>
    </header>

    <section class="card">
      <div class="row">
        <label for="enabledToggle" class="label">自動打刻を有効にする</label>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="card status-card">
      <div class="status-title">ステータス</div>
      <div id="statusText" class="status-text">読み込み中...</div>
      <div id="lastPunchText" class="meta-text"></div>
    </section>

    <div class="actions">
      <button id="runNowBtn" class="btn btn-primary">手動で実行</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出勤一打</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>出勤一打</h1>
      <span id="todayBadge" class="badge badge-pending">未打刻</span>
    </header>

    <section class="card">
      <div class="row">
        <label for="enabledToggle" class="label">自動打刻を有効にする</label>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="card ip-card">
      <div class="row">
        <label for="ipFilterToggle" class="label">指定IPのみで自動打刻（任意）</label>
        <label class="switch">
          <input type="checkbox" id="ipFilterToggle" />
          <span class="slider"></span>
        </label>
      </div>
      <div id="ipConfigArea" class="ip-config">
        <label for="allowedIpInput" class="sub-label">学校のグローバルIP</label>
        <input
          type="text"
          id="allowedIpInput"
          class="text-input"
          placeholder="例: 203.0.113.10"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="ip-actions">
          <button type="button" id="fetchIpBtn" class="btn btn-small btn-outline">現在のIPを取得</button>
          <button type="button" id="saveIpBtn" class="btn btn-small btn-secondary">保存</button>
        </div>
        <div id="ipHintText" class="meta-text">カンマ区切りで複数IPも指定できます</div>
      </div>
    </section>

    <section class="card status-card">
      <div class="status-title">ステータス</div>
      <div id="statusText" class="status-text">読み込み中...</div>
      <div id="lastPunchText" class="meta-text"></div>
    </section>

    <div class="actions">
      <button id="runNowBtn" class="btn btn-primary">手動で出勤</button>
      <button id="punchOutBtn" class="btn btn-punchout">退勤を記録</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
